# Mica PoC — Release: build PoC binaries for Linux / Windows / macOS
# and attach them to a GitHub Release.
#
# Triggered by a tag push (v*) or manually (workflow_dispatch, with
# a tag input, default v0.1.0). The release is marked as a
# pre-release: these are proof-of-concept builds, not a product.
#
# Tauri is built with `npx tauri build` (real installers per OS).
# egui and GPUI are built with `cargo build --release` and uploaded
# as plain binaries, renamed per OS. GPUI jobs are best-effort
# (continue-on-error): a GPUI build failure on one OS must not hide
# the other PoCs' binaries.
name: Release PoC binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  tauri-release:
    name: Tauri PoC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: poc/tauri-codemirror/package-lock.json
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev libsoup-3.0-dev
      - name: Install frontend dependencies
        working-directory: poc/tauri-codemirror
        run: npm ci
      - name: Build Tauri bundle
        working-directory: poc/tauri-codemirror
        run: npx tauri build
      - name: Upload Tauri bundles to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Mica PoC ${{ inputs.tag || github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: false
          body: |
            Mica PoC binaries — Tauri + CodeMirror 6, GPUI, and egui builds
            of the Markdown editor proof of concept (see docs/evaluation.md
            for the measured comparison; Tauri + CodeMirror 6 is the
            recommended option).
            These are proof-of-concept builds, not a finished product:
            live Japanese IME and 5,000-line smoothness are unverified.
          files: |
            poc/tauri-codemirror/src-tauri/target/release/bundle/deb/*.deb
            poc/tauri-codemirror/src-tauri/target/release/bundle/rpm/*.rpm
            poc/tauri-codemirror/src-tauri/target/release/bundle/appimage/*.AppImage
            poc/tauri-codemirror/src-tauri/target/release/bundle/msi/*.msi
            poc/tauri-codemirror/src-tauri/target/release/bundle/nsis/*-setup.exe
            poc/tauri-codemirror/src-tauri/target/release/bundle/dmg/*.dmg

  egui-release:
    name: egui PoC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install eframe system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libwayland-dev libvulkan-dev pkg-config cmake
      - name: Build egui PoC (release)
        run: cargo build --release -p mica-egui-poc
      - name: Rename binary per OS
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/mica-egui.exe dist/mica-egui-windows-x86_64.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp target/release/mica-egui dist/mica-egui-macos-aarch64
          else
            cp target/release/mica-egui dist/mica-egui-linux-x86_64
          fi
      - name: Upload egui binary to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Mica PoC ${{ inputs.tag || github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: false
          body: |
            Mica PoC binaries — Tauri + CodeMirror 6, GPUI, and egui builds
            of the Markdown editor proof of concept (see docs/evaluation.md
            for the measured comparison; Tauri + CodeMirror 6 is the
            recommended option).
            These are proof-of-concept builds, not a finished product:
            live Japanese IME and 5,000-line smoothness are unverified.
          files: |
            dist/mica-egui-*

  gpui-release:
    name: GPUI PoC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GPUI system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev pkg-config cmake clang
      - name: Build GPUI PoC (release)
        run: cargo build --release -p mica-gpui-poc
      - name: Rename binary per OS
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/mica-gpui.exe dist/mica-gpui-windows-x86_64.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp target/release/mica-gpui dist/mica-gpui-macos-aarch64
          else
            cp target/release/mica-gpui dist/mica-gpui-linux-x86_64
          fi
      - name: Upload GPUI binary to the release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Mica PoC ${{ inputs.tag || github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: false
          body: |
            Mica PoC binaries — Tauri + CodeMirror 6, GPUI, and egui builds
            of the Markdown editor proof of concept (see docs/evaluation.md
            for the measured comparison; Tauri + CodeMirror 6 is the
            recommended option).
            These are proof-of-concept builds, not a finished product:
            live Japanese IME and 5,000-line smoothness are unverified.
          files: |
            dist/mica-gpui-*
